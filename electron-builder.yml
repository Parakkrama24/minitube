appId: com.minitube.app
productName: MiniTube
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  # electron-builder derives the .ico from this 256px png.
  # Regenerate with: node scripts/make-icon.mjs
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: MiniTube-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: MiniTube
